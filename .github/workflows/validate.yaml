name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Lint
        # Pinned: ruff enables new rules in minor releases, which would
        # otherwise fail this job on a commit that changed nothing.
        run: |
          pip install ruff==0.16.7
          ruff check custom_components/ tests/
      - name: Unlock routing tests
        # Home Assistant is stubbed, so no HA install and no hardware are
        # needed - but the modules under test import aiohttp, which Home
        # Assistant ships and a bare runner does not.
        run: |
          pip install aiohttp
          python tests/test_button_logic.py
